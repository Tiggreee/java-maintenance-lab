spring.application.name=java-maintenance-lab
server.servlet.context-path=/maintlab

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

spring.datasource.url=jdbc:h2:mem:maintlab;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.h2.console.enabled=true

incidents.default-sla-minutes=45
incidents.sla.watch-delay-ms=60000
